name: APK Derle

on:
  push:
    branches: [ main, master, "ccr-*", "claude/**" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Testler
        run: ./gradlew --no-daemon :app:testDebugUnitTest

      # İmzalama anahtarı depoda değil, GitHub gizli değişkenlerinde durur
      # (Settings > Secrets and variables > Actions): KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD. Tanımlı değilse APK debug
      # anahtarıyla imzalanır ve önceki sürümün üstüne kurulamaz.
      - name: İmzalama anahtarını hazırla
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          else
            echo "::warning::KEYSTORE_BASE64 tanımlı değil; APK debug anahtarıyla imzalanacak."
          fi

      - name: APK derle
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon :app:assembleRelease

      - name: APK adını düzenle
        run: cp app/build/outputs/apk/release/app-release.apk EmlakTakip-1.0.${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: EmlakTakip-apk
          path: EmlakTakip-*.apk

      - name: GitHub sürümü oluştur (telefondan indirmek için)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Emlak Takip 1.0.${{ github.run_number }}
          prerelease: ${{ github.ref_name != 'main' && github.ref_name != 'master' }}
          files: EmlakTakip-*.apk
          body: |
            Telefonunuzdan bu sayfayı açıp **EmlakTakip-1.0.${{ github.run_number }}.apk** dosyasını indirin ve kurun.
            Önceki sürümün üstüne kurulabilir; kayıtlarınız silinmez.
