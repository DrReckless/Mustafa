name: Web Sitesini Yayınla

# Web arayüzünü derler ve "gh-pages" dalına koyar.
# GitHub Pages bir kez açıldıktan sonra (Settings → Pages → Branch: gh-pages)
# her güncellemede site otomatik yenilenir.

on:
  push:
    branches: [main, master, claude/zen-hypatia-ratbqz]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: web-yayin
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Derle ve test et
        working-directory: web
        env:
          OUT_DIR: ../site
        run: |
          npm ci
          npm test
          npm run build
          touch ../site/.nojekyll

      - name: gh-pages dalına yayınla
        run: |
          cd site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Web sitesi: ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages
